[metadata]
name = trajectory-viz
version = attr: trajectory_viz.__version__
description = Render a planner's trajectories over a recorded drive as images and animations
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE

[options]
packages = trajectory_viz
python_requires = >=3.8
install_requires =
    matplotlib>=3.5
    numpy>=1.21
    Pillow>=9.1

[options.extras_require]
test = pytest

[options.entry_points]
console_scripts =
    trajectory-viz = trajectory_viz.__main__:main

# flake8 and isort: taken from https://github.com/autowarefoundation/sync-file-templates

[flake8]
# Modified from https://github.com/ament/ament_lint/blob/ebd524bb9973d5ec1dc48a670ce54f958a5a0243/ament_flake8/ament_flake8/configuration/ament_flake8.ini
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,CNL100,E203,E501,Q000
import-order-style = pep8
max-line-length = 100
show-source = true
statistics = true

[isort]
profile=black
line_length=100
force_sort_within_sections=true
force_single_line=true
reverse_relative=true
known_third_party=launch
